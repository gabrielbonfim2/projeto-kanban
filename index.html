<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Quadro Kanban</h1>

  <div class="top-bar">
    <input type="text" id="taskInput" placeholder="Digite uma tarefa">
    <button id="addTaskBtn">Adicionar</button>
  </div>

  <div class="board">
    <div class="column" data-status="todo">
      <h2>A Fazer</h2>
      <div id="todo" class="card-list"></div>
    </div>

    <div class="column" data-status="doing">
      <h2>Fazendo</h2>
      <div id="doing" class="card-list"></div>
    </div>

    <div class="column" data-status="done">
      <h2>Concluído</h2>
      <div id="done" class="card-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
